[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
# E501: line length handled by formatter, not worth failing CI over.
# B008: FastAPI's `Depends(...)` in a default argument is the documented,
# idiomatic pattern for dependency injection -- not a real bug here.
ignore = ["E501", "B008"]
